name: Build

# macOS builds are signed and notarized locally (scripts/release.sh); CI builds Windows and Linux.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          # Kyoma233 fork only: an unsigned Apple Silicon build (upstream signs and notarizes macOS locally).
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config cmake clang
      - name: Windows dependencies
        if: startsWith(matrix.platform, 'windows')
        run: choco install -y llvm cmake --no-progress
      - name: Visual C++ runtime for CrispASR (app-local, redistributable)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -match '^\d' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          $omp = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter "Microsoft.VC*.OpenMP" | Select-Object -First 1
          foreach ($f in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") { Copy-Item "$($crt.FullName)\$f" src-tauri/windows/vcrt/ }
          Copy-Item "$($omp.FullName)\vcomp140.dll" src-tauri/windows/vcrt/
          Get-ChildItem src-tauri/windows/vcrt
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: SubCast ${{ github.ref_name }}
          releaseDraft: true
          # latest.json is written by scripts/release.sh once the Mac builds are in.
          includeUpdaterJson: false
          args: ${{ matrix.args }}
      # subcast.exe must start on a PC without the Visual C++ Redistributable, and the installer must carry the
      # runtime CrispASR needs. Fails the build otherwise.
      - name: Check Windows runtime dependencies
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          python scripts/pe-imports.py src-tauri/target/release/subcast.exe --forbid msvcp140.dll vcruntime140.dll vcruntime140_1.dll vcomp140.dll
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $list = & 7z l $setup.FullName
          foreach ($f in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "vcomp140.dll") {
            if (-not ($list | Select-String -SimpleMatch $f)) { throw "installer is missing vcrt/$f" }
          }
          Write-Output "ok: no VC++ runtime imports; installer carries vcrt"
